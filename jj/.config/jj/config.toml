#:schema https://docs.jj-vcs.dev/latest/config-schema.json
# [user] and [signing] live in ~/.config/jj/conf.d/user.toml (per machine, untracked) to keep emails out of this public repo.

# The `trunk().. &` bit is an optimization to scan for non-`mine()` commits
# only among commits that are not in `trunk()`.
[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | (trunk().. & ~mine())"

# This will treat any commit starting with wip: or private: as a private commit, 
# meaning jj will prevent pushing it by default. This is good for workflows that iteratively 
# amend a commit but you’d otherwise not want to push it (or its descendants) 
# until it is in a “ready” state

[git]
private-commits = "description(glob:'wip:*') | description(glob:'private:*')"

[fsmonitor]
# set to "watchman" or "none"
backend = "none"

[diff]
tool = "delta"

[ui]
diff-formatter = ":git" # required by `delta`
pager=["delta", "--pager", "less -FRX"] # Keeps output from the terminal after closing the pager

# These options allow for `jj diff` and `jj show` to clear the output from the terminal after closing the pager.
[[--scope]]
--when.commands = ["diff", "show"]

[--scope.ui]
pager = "delta"

[aliases]
# `jj restack` to rebase your changes onto `trunk()`
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents"]
